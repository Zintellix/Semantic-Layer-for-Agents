domain: sales
label: "Sales · Pipeline"
flagship: "Are we going to hit quota on our top deals this quarter?"
signal_type: SLIPPAGE_RISK
samples:
  - "Are we going to hit quota on our top deals this quarter?"
  - "How is the weighted pipeline on our biggest deals?"
  - "will deal 99 close"
primary_type: Opportunity
object_set: fn.top_deals
prefetch:
  member_props: [name, amount, probability, weighted_pipeline, days_to_close]
metric:
  mode: aggregate
  value: weighted_pipeline
  threshold: 5000000
  threshold_label: "committed quota"
  direction: at_least
  unit: "₹"
  event_noun: quota miss
action:
  action_type: escalate_deal
  param: urgency_days
  param_mode: one
aliases:
  object_sets:
    fn.top_deals: ["top deals", "biggest deals", "key opportunities", "top deal"]
  windows: {}
