# Marketing pack — campaign budgets. Campaign is the primary object.
- object_type: Channel
  pack: marketing
  primary_key: channel_id
  title_property: name
  datasource: sqlite.channels
  properties:
    name:     { type: string, source: channels.name }
    platform: { type: string, source: channels.platform }

- object_type: Campaign
  pack: marketing
  primary_key: campaign_id
  title_property: name
  datasource: sqlite.campaigns
  properties:
    name:             { type: string, source: campaigns.name }
    channel_id:       { type: string, source: campaigns.channel_id }
    spend_28d:        { type: money,  source: campaigns.spend_28d }
    budget_remaining: { type: money,  source: campaigns.budget_remaining }
    daily_spend:      { type: number, source: campaigns.daily_spend }
    roas:             { type: number, source: campaigns.roas }
    days_of_budget:   { type: number, function: fn.days_of_budget }
  links:
    on_channel: { to: Channel, cardinality: "1:N", join: [channel_id] }
