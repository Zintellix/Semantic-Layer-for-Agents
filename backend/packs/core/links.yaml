# Core pack — link types (also declared inline on objects; listed here as the
# authoritative link registry the compiler validates endpoints against).
- link_type: has_variant
  from_type: Product
  to_type: Variant
  cardinality: "1:N"
  join: [product_id]
- link_type: stocked_at
  from_type: Variant
  to_type: InventoryPosition
  cardinality: "1:N"
  join: [variant_id]
