# Core pack — action types. Actions are enumerated from the ontology; the agent
# may never invent one outside this registry.
- action_type: flag_for_review
  object_type: Variant
  tier: 0                      # auto-log, no human gate
  reversibility: REVERSIBLE
  parameters:
    reason: { type: string }
  guards: []
  connector_write: none
  rollback: null

- action_type: update_inventory_level
  object_type: Variant
  tier: 2                      # explicit approval before mock connector write
  reversibility: REVERSIBLE
  parameters:
    level: { type: number, min: 0, max: 100000 }
  guards: []
  connector_write: mock_shopify
  rollback: restore_previous_level
