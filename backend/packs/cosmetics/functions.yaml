# Cosmetics pack — functions. Deterministic; no LLM inside a function.
# Every declared test is executed at COMPILE time (L2). A red test fails the build.

# Derived property — TRUE days of stock (correction §2.1). Drives the stockout date.
- function_id: fn.days_of_stock
  returns: number
  kind: derived
  inputs: [on_hand, avg_daily_units_7d]
  formula: "on_hand / avg_daily_units_7d"
  tests:
    - inputs: { on_hand: 148, avg_daily_units_7d: 5.0 }
      expect: 29.6
      tol: 0.01

# Derived property — the doc's §6.2 formula verbatim. NOT days: a lead-time
# coverage multiple. Kept green as a reorder-urgency signal (correction §2.1).
- function_id: fn.lead_time_coverage
  returns: number
  kind: derived
  inputs: [on_hand, avg_daily_units_7d]
  params: { lead_time_days: 10 }
  formula: "on_hand / (avg_daily_units_7d * lead_time_days * 1.2)"
  tests:
    - inputs: { on_hand: 100, avg_daily_units_7d: 5.0 }
      expect: 1.67
      tol: 0.01

# Object set — top-3 CosmeticsVariant by revenue_28d. Computed, never hardcoded.
- function_id: fn.hero_shades
  returns: object_set
  kind: object_set
  params: { object_type: CosmeticsVariant, top_n: 3, rank_by: revenue_28d }
  tests:
    - expect_ids: ["220", "145", "310"]

# Decision function — is this variant a hero shade? Consumed by L8 severity + L9 guards.
- function_id: fn.is_hero_shade
  returns: classification
  kind: decision
  params: { membership_of: fn.hero_shades }

# Decision function — stockout severity for an event (delegates to hero membership).
- function_id: fn.stockout_severity
  returns: classification
  kind: decision
  params: { membership_of: fn.hero_shades }
