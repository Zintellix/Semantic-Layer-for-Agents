# Cosmetics pack — action types.
- action_type: prioritise_hero_shade_replenishment
  object_type: CosmeticsVariant
  tier: 1                        # recommendation — renders an action card
  reversibility: "N/A"
  parameters:
    urgency_days: { type: number, min: 1, max: 90 }
  guards:
    - fn.is_hero_shade          # blocks the proposal if the target is not a hero shade
  connector_write: none         # action card only
  rollback: null
