- action_type: escalate_renewal
  object_type: RenewalAccount
  tier: 1
  reversibility: "N/A"
  parameters:
    urgency_days: { type: number, min: 1, max: 90 }
  guards:
    - fn.is_top_account
  connector_write: none
  rollback: null

- action_type: flag_for_review
  object_type: RenewalAccount
  tier: 0
  reversibility: REVERSIBLE
  parameters:
    reason: { type: string }
  guards: []
  connector_write: none
  rollback: null
