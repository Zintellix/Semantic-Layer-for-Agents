domain: saas
label: "SaaS · Renewals"
flagship: "Is the churn risk on our largest accounts above our churn budget?"
signal_type: CHURN_RISK
samples:
  - "Is the churn risk on our largest accounts above our churn budget?"
  - "How much ARR is at risk across our biggest accounts?"
  - "will account 7 renew"
primary_type: RenewalAccount
object_set: fn.top_accounts
prefetch:
  member_props: [name, arr, health_score, renewal_probability, days_to_renewal, arr_at_risk]
metric:
  mode: aggregate
  value: arr_at_risk
  threshold: 2000000
  threshold_label: "churn budget"
  direction: at_most
  unit: "₹"
  event_noun: churn
action:
  action_type: escalate_renewal
  param: urgency_days
  param_mode: one
aliases:
  object_sets:
    fn.top_accounts: ["largest accounts", "biggest accounts", "top accounts", "key accounts"]
  windows: {}
